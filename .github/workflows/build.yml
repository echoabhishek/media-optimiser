# Builds installers for macOS, Windows and Linux. Each OS builds on its own
# runner because ffmpeg-static downloads the ffmpeg binary for the host OS.
name: Build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  make:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, arch: arm64 }
          - { os: macos-latest, arch: x64 } # Intel Macs
          - { os: windows-latest, arch: x64 }
          - { os: ubuntu-latest, arch: x64 }
    runs-on: ${{ matrix.os }}
    env:
      # Makes ffmpeg-static (arch) and sharp's optional deps (cpu) install the
      # binaries for the target architecture.
      npm_config_arch: ${{ matrix.arch }}
      npm_config_cpu: ${{ matrix.arch }}
      # Signing activates only when these secrets are set (see README).
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm fakeroot dpkg
      - run: npm ci
      - run: npm run typecheck
      - if: matrix.arch == runner.arch || runner.os != 'macOS'
        run: npm test
      - run: npm run make -- --arch=${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: media-optimiser-${{ matrix.os }}-${{ matrix.arch }}
          path: out/make/**
