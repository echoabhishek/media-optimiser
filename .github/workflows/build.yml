# Builds installers for macOS, Windows and Linux. Each OS builds on its own
# runner because ffmpeg-static downloads the ffmpeg binary for the host OS.
name: Build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

# Needed to create a GitHub Release from a tag.
permissions:
  contents: write

jobs:
  make:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, arch: arm64 }
          - { os: macos-15-intel, arch: x64 }
          - { os: windows-latest, arch: x64 }
          # 26.04's rpmbuild breaks electron-installer-redhat's spec.
          - { os: ubuntu-24.04, arch: x64 }
    runs-on: ${{ matrix.os }}
    env:
      # Signing activates only when these secrets are set (see README).
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      HAS_MAC_CERT: ${{ secrets.MACOS_CERT_P12 != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Newest LTS release (22, 24 and 26 are supported).
          node-version: lts/*
          check-latest: true
          cache: npm
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm fakeroot dpkg
      # Signing needs the Developer ID certificate in a keychain; runners start empty.
      - if: runner.os == 'macOS' && env.HAS_MAC_CERT == 'true'
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run make
      - uses: actions/upload-artifact@v7
        with:
          name: media-optimiser-${{ matrix.os }}-${{ matrix.arch }}
          path: out/make/**
      # A pushed v* tag also publishes the installers as a GitHub Release.
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            out/make/**/*.zip
            out/make/**/*.exe
            out/make/**/*.nupkg
            out/make/**/RELEASES
            out/make/**/*.deb
            out/make/**/*.rpm
